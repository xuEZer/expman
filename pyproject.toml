[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expman"
version = "0.1.0"
description = "Composable experiment pipelines with execution monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit==4.6.2", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expman = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501"]
