[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expman"
version = "0.1.0"
description = "Composable experiment pipelines with execution monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pre-commit==4.6.2", "ruff==0.16.6"]
# Optional execution backends. The framework imports either one only if it is
# already installed, so a plain install never pulls them; the matching tests skip
# themselves when the backend is absent.
numpy = ["numpy>=1.26"]
torch = ["torch>=2.0"]
# Both backends, for running the full matrix in a separate environment.
optional = ["numpy>=1.26", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expman = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501"]
