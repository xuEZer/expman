[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expman"
version = "0.1.0"
description = "Composable experiment pipelines with execution monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=1.26",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.390",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expman = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# B008 is ignored because `max_iter=Stage.cfg("key")` in the loop() signature is
# the supported idiom for declaring a configuration-resolved iteration count;
# the call is cheap, idempotent and evaluated exactly once per class definition.
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501", "B008"]
