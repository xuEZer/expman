repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: python
        additional_dependencies: [ruff==0.16.6]
        always_run: true
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check .
        language: python
        additional_dependencies: [ruff==0.16.6]
        always_run: true
        pass_filenames: false
      - id: pyright
        name: Pyright type check
        entry: uv run pyright
        language: system
        always_run: true
        pass_filenames: false
      - id: pytest
        name: Pytest test suite
        entry: uv run pytest
        language: system
        always_run: true
        pass_filenames: false
