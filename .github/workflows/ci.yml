name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Ruff is a development tool, not a package dependency.
      - run: uv run --with ruff==0.16.6 ruff check .
      - run: uv run --with ruff==0.16.6 ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Pyright ships its own Node runtime; the dev group pins it for CI parity.
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python examples/basic_pipeline.py
      - run: uv run python examples/load_experiments.py
      - run: uv run python examples/batch_pipeline.py
      - run: uv run python examples/checkpoint_pipeline.py
      - run: uv run python examples/estimate_time.py
      - run: uv run python examples/multi_gpu.py
      - run: uv run python examples/random_state.py
      - run: uv run python examples/shared_prefix.py

  random-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest tests/test_randomness.py -v
