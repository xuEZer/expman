name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python examples/basic_pipeline.py
      - run: uv run python examples/load_experiments.py
      - run: uv run python examples/batch_pipeline.py
      - run: uv run python examples/checkpoint_pipeline.py
      - run: uv run python examples/estimate_time.py
      - run: uv run python examples/multi_gpu.py
      - run: uv run python examples/random_state.py
      - run: uv run python examples/shared_prefix.py

  random-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -p test_randomness.py -v
