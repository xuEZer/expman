<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>expman 运行看板 · 批次详情</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/results.css">
<link rel="stylesheet" href="/static/plot.css">
</head>
<body data-page="batch">
<main id="app">
  <div id="batch-header"><p class="muted pad">连接中…</p></div>
  <div id="batch-tabs" class="batch-tabs" role="tablist" aria-label="批次详情" hidden>
    <button id="tab-status" type="button" role="tab" aria-controls="status-panel" aria-selected="true">运行情况</button>
    <button id="tab-results" type="button" role="tab" aria-controls="results-panel" aria-selected="false" tabindex="-1">实验结果</button>
    <button id="tab-plot" type="button" role="tab" aria-controls="plot-panel" aria-selected="false" tabindex="-1">自动绘图</button>
  </div>
  <section id="status-panel" role="tabpanel" aria-labelledby="tab-status" tabindex="0"></section>
  <section id="results-panel" role="tabpanel" aria-labelledby="tab-results" tabindex="0" hidden></section>
  <section id="plot-panel" role="tabpanel" aria-labelledby="tab-plot" tabindex="0" hidden>
    <div class="plot-controls">
      <div class="plot-axes">
        <div class="plot-axis-x">
          <label for="plot-x">X 轴</label>
          <div class="plot-select"><select id="plot-x"></select></div>
        </div>
        <fieldset class="plot-axis-y">
          <legend>Y 轴</legend>
          <div id="plot-y" class="plot-checks"></div>
        </fieldset>
      </div>
      <section class="plot-filters" aria-labelledby="plot-filter-title" hidden>
        <h2 id="plot-filter-title">变量控制</h2>
        <div id="plot-values"></div>
      </section>
    </div>
    <p id="plot-message" role="status" hidden></p>
    <div id="plot-output"></div>
  </section>
</main>
<script src="/static/plot.js"></script>
<script src="/static/plot-panel.js"></script>
<script src="/static/results.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
